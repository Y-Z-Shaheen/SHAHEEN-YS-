name: SHAHEEN-YS CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: Validate Python Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install test dependencies
        run: |
          python -m pip install \
            pytest \
            pytest-asyncio \
            python-dotenv \
            flask \
            sqlalchemy \
            pydantic

      - name: Validate Python syntax
        run: |
          python -m compileall -q app

      - name: Initialize database
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from app.database import initialize_database
          initialize_database()
          print('Database initialization passed.')
          "

      - name: Validate application imports
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
          from app.database import initialize_database
          from app.dashboard.app import create_dashboard_app

          initialize_database()

          application = create_dashboard_app()

          if application is None:
              raise RuntimeError(
                  'Dashboard application was not created.'
              )

          print('Application imports passed.')
          "

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          SHAHEEN_YS_ENV: testing
        run: |
          if [ -d "tests" ]; then
            python -m pytest -q
          else
            echo "No tests directory found. Skipping tests."
          fi

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker files
        run: |
          test -f Dockerfile
          test -f .dockerignore

      - name: Build Docker image
        run: |
          docker build \
            --tag shaheen-ys:ci \
            .

      - name: Docker image created
        run: |
          docker image inspect shaheen-ys:ci > /dev/null

          echo "Docker image validation passed."

  security:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip-audit

      - name: Audit dependencies
        run: |
          if [ -f "requirements.txt" ]; then
            pip-audit \
              --requirement requirements.txt \
              --progress-spinner off \
              || true
          else
            echo "requirements.txt not found."
          fi
